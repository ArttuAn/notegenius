<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13113a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e9d5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.49 0 0 0 0 0.23 0 0 0 0 0.93 0 0 0 1 0" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
    </filter>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  <rect width="280" height="80" rx="14" ry="14" fill="url(#bgGrad)" />
  <ellipse cx="44" cy="40" rx="28" ry="26" fill="#7c3aed" opacity="0.13" filter="url(#haloGlow)" />
  <g transform="translate(14, 10)" filter="url(#iconGlow)">
    <rect x="8" y="8" width="26" height="32" rx="3.5" ry="3.5"
          fill="none" stroke="url(#iconGrad)" stroke-width="1.6" opacity="0.5" />
    <line x1="12.5" y1="19" x2="29.5" y2="19" stroke="#a78bfa" stroke-width="1.3" stroke-linecap="round" opacity="0.55" />
    <line x1="12.5" y1="24" x2="29.5" y2="24" stroke="#a78bfa" stroke-width="1.3" stroke-linecap="round" opacity="0.55" />
    <line x1="12.5" y1="29" x2="23" y2="29" stroke="#a78bfa" stroke-width="1.3" stroke-linecap="round" opacity="0.55" />
    <line x1="14" y1="8" x2="14" y2="40" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M21,5 C17,5 13.5,7.5 13,11 C12.5,13 13.5,15 15,15.5 C14,17 14,19.5 15.5,20.5 C15,22 15.5,23.5 17,24 L21,24 Z"
          fill="url(#iconGrad)" opacity="0.92" />
    <path d="M21,5 C25,5 28.5,7.5 29,11 C29.5,13 28.5,15 27,15.5 C28,17 28,19.5 26.5,20.5 C27,22 26.5,23.5 25,24 L21,24 Z"
          fill="url(#iconGrad)" opacity="0.82" />
    <line x1="21" y1="5.5" x2="21" y2="23.5" stroke="#0f0f23" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M15.8,12 Q17.5,10.5 17.5,13.5 Q17.5,16 15.5,16" fill="none" stroke="#0f0f23" stroke-width="0.9" opacity="0.45" stroke-linecap="round" />
    <path d="M26.2,12 Q24.5,10.5 24.5,13.5 Q24.5,16 26.5,16" fill="none" stroke="#0f0f23" stroke-width="0.9" opacity="0.45" stroke-linecap="round" />
    <circle cx="30" cy="5" r="1.8" fill="#a78bfa" opacity="0.95" />
    <line x1="30" y1="2.2" x2="30" y2="7.8" stroke="#a78bfa" stroke-width="0.8" opacity="0.7" stroke-linecap="round" />
    <line x1="27.2" y1="5" x2="32.8" y2="5" stroke="#a78bfa" stroke-width="0.8" opacity="0.7" stroke-linecap="round" />
    <line x1="28.1" y1="2.9" x2="31.9" y2="7.1" stroke="#a78bfa" stroke-width="0.7" opacity="0.5" stroke-linecap="round" />
    <line x1="31.9" y1="2.9" x2="28.1" y2="7.1" stroke="#a78bfa" stroke-width="0.7" opacity="0.5" stroke-linecap="round" />
  </g>
  <g transform="translate(68, 0)">
    <text x="0" y="46" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
          font-size="26" font-weight="700" letter-spacing="-0.5" fill="url(#textGrad)">NoteGenius</text>
    <text x="1" y="61" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
          font-size="9.5" font-weight="500" letter-spacing="2.2" fill="url(#subGrad)" opacity="0.85">AI RESEARCH ASSISTANT</text>
    <line x1="0" y1="66" x2="172" y2="66" stroke="url(#subGrad)" stroke-width="0.7" opacity="0.3" stroke-linecap="round" />
  </g>
  <rect width="280" height="80" rx="14" ry="14" fill="none" stroke="url(#borderGrad)" stroke-width="1" />
</svg>
