name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # No secret is needed to compile: the key is only read when a request
      # is served, and the database is opened lazily for the same reason.
      - run: npm run build
        env:
          CLAUDE_API_KEY: sk-ant-ci-placeholder
